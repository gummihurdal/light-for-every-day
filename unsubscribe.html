<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Unsubscribe — Light for Every Day</title><meta name="robots" content="noindex">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"></head>
<body><main><section class="card" style="text-align:center;padding:48px 24px" id="box"><h1>Stop the daily e-mail?</h1><p class="muted">You can come back any time. Your journal and progress in the app are unaffected; they live on your device.</p><button class="btn primary" id="go">Yes, unsubscribe</button></section></main>
<script src="assets/app.js"></script>
<script>
LD.chrome('subscribe');
const t = new URLSearchParams(location.search).get('t'); const box = document.getElementById('box');
if (!t) box.innerHTML = '<h1>Missing link</h1><p class="muted">Please use the unsubscribe link at the bottom of one of our e-mails.</p>';
document.getElementById('go')?.addEventListener('click', async () => {
  try {
    const r = await fetch(LD.SB + '/rest/v1/rpc/ld_unsubscribe', { method: 'POST', headers: { apikey: LD.KEY, Authorization: 'Bearer ' + LD.KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: t }) });
    const ok = r.ok && (await r.json()) === true;
    box.innerHTML = ok ? '<h1>Done</h1><p>No more e-mails will be sent. Your address will be removed. Go gently.</p><a class="btn ghost" href="index.html">Back to the app</a>' : '<h1>Link not recognised</h1><p class="muted">It may already have been used. If you still receive e-mails, write to hello@graceforevery.day.</p>';
  } catch (e) { box.innerHTML = '<h1>Something went wrong</h1><p class="muted">Please try again in a minute.</p>'; }
});
</script></body></html>
