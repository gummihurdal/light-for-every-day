<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Light — Light for Every Day</title>
<meta name="description" content="Today's message: a quote, an explanation grounded in research, one small challenge and questions for reflection.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1628">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/grace.css?v=202611082153">
</head>
<body>
<main class="main">
  <div class="topbar">
    <div class="tb-greeting" id="greeting"></div>
    <div class="tb-date" id="topdate"></div>
  </div>
  <div id="loading"><span class="load-t" id="load-t">Preparing today's light</span></div>
  <div id="app" style="display:none;flex:1;flex-direction:column"></div>
</main>
<script src="assets/app.js?v=202611082153"></script>
<script src="assets/shell.js?v=202611082153"></script>
<script>
document.getElementById('greeting').textContent = greetingFor(); document.getElementById('load-t').textContent = T.preparing;
document.getElementById('topdate').textContent = topDate();
const params = new URLSearchParams(location.search);
if (params.get('start') === '1' && !LD.startedOn()) { LD.start(); history.replaceState(null, '', 'today.html'); }
const MOODS = ['😞', '😔', '😐', '🙂', '😊'].map((e, i) => [e, T.moods[i]]);
const esc = LD.esc;

async function init() {
  const today = LD.currentDay();
  let day = parseInt(params.get('day') || '0', 10); if (!day) day = today || 1;
  const started = !!LD.startedOn();
  const m = await LD.getMessage(day);
  const app = document.getElementById('app');
  document.getElementById('loading').style.display = 'none';
  app.style.display = 'flex';
  if (!m) { app.innerHTML = `<div class="hero"><div class="hero-eyebrow">Day ${day}</div><div class="hero-theme">This day is still being written</div><a class="hero-cta" href="topics.html">See the Journey</a></div>`; LDshell.addCrisis(); return; }
  const themes = await LD.getThemes();
  const th = themes.find(t => t.slug === m.theme) || {};
  const doneMap = LD.done(), j = LD.journal()[day] || {}, s = LD.settings;
  const sc = m.scripture || null;
  const sourceIds = Array.isArray(m.sources) ? m.sources.filter(x => typeof x === 'number') : [];
  const paras = LD.paras(m.explanation);
  const qs = (m.reflection_questions || []).map((q, i) => `<div class="sp-q"><div class="sp-qt">${T.question} ${i + 1}</div><div class="sp-qtxt">${esc(q)}</div><textarea class="sp-ta" data-i="${i}" placeholder="${T.notes}">${esc(j[i] || '')}</textarea></div>`).join('');
  const moodToday = LD.moods()[LD.todayISO()];
  const ahead = started && today && day > today;

  app.innerHTML = `
    <div class="hero">
      <div class="hero-eyebrow">${T.day} ${day} ${T.of} ${LD.TOTAL_DAYS} · ${T.week} ${th.week || ''}${day === today ? ' · ' + T.today_ : ''}</div>
      <div class="flame"><div class="flame-glow"></div><div class="flame-flame"></div><div class="flame-body"></div></div>
      <div class="hero-quote">
        <div class="hero-quote-text">"${esc(m.quote)}"</div>
        <div class="hero-quote-by">— ${esc(m.quote_source)}</div>
      </div>
      <div class="hero-theme">${esc(m.title)}</div>
      ${!started ? `<a href="#" class="hero-cta" onclick="LD.start();location.href='today.html';return false">${T.beginDayOne}</a>` : `<a href="#reading" class="hero-cta">${T.beginReading}</a>`}
      ${ahead ? `<div class="hero-eyebrow" style="margin-top:22px;margin-bottom:0">${T.ahead} ${today}</div>` : ''}
      ${m.fallback ? `<div class="hero-eyebrow" style="margin-top:22px;margin-bottom:0">${T.inEnglish}</div>` : ''}
    </div>

    <div class="cards-row">
      <div class="card">
        <div class="card-lbl">${T.hope}</div>
        <div class="card-body">${sc && s.scripture ? `<strong>${esc(sc.reference)}</strong>${esc(sc.text)}` : `<strong>${esc(th.title || '')}</strong>${esc(th.subtitle || '')}`}</div>
      </div>
      <div class="card">
        <div class="card-lbl">${T.thisWeek}</div>
        <div class="card-body"><strong>${esc(th.title || '')}</strong>${esc(th.subtitle || '')}</div>
      </div>
      <div class="card">
        <div class="card-lbl">${T.evidence}</div>
        <div class="card-body"><strong>${sourceIds.length} ${T.studies}</strong>${T.evidenceNote}</div>
      </div>
    </div>

    <div class="body" id="reading">
      <div class="two-col">
        <div>
          <div class="med-block">
            <div class="block-lbl">${T.explanation}</div>
            <div class="med-title">${esc(m.title)}</div>
            <div class="qbar"><div class="qbar-t">"${esc(m.quote)}"</div><div class="qbar-by">— ${esc(m.quote_source)}</div></div>
            <div class="med-body">${paras}</div>
            <div class="src-row"><a class="src-tag" href="learn.html?topic=${m.theme}">${esc(th.title || '')}</a><span class="src-tag">${T.week} ${th.week || ''}</span><span class="src-tag">${sourceIds.length} ${T.sources}</span></div>
          </div>
          <div class="orn"><div class="orn-l"></div><span class="orn-s">· · ·</span><div class="orn-l"></div></div>
          <div class="call-block">
            <div class="block-lbl">${T.challenge}</div>
            <div class="call-text prose">${LD.paras(m.challenge)}</div>
            <label class="done-row ${doneMap[day] ? 'on' : ''}"><input type="checkbox" id="done" ${doneMap[day] ? 'checked' : ''}> ${T.didIt}</label>
          </div>
          ${sc && s.scripture ? `<div class="pray-block"><div class="block-lbl">${T.hope}</div><div class="pray-text">${esc(sc.text)}</div><div class="hero-quote-by" style="margin-top:14px">${esc(sc.reference)}</div></div>` : ''}
          <div class="scripture-close">
            <div class="block-lbl">${T.carry}</div>
            <div class="sc-verse">"${esc(m.quote)}"</div>
            <div class="sc-ref">${esc(m.quote_source)}</div>
          </div>
          <div class="lv-nav">
            ${day > 1 ? `<a class="lv-btn" href="today.html?day=${day - 1}">← ${T.day} ${day - 1}</a>` : '<span></span>'}
            ${day < LD.TOTAL_DAYS ? `<a class="lv-btn" href="today.html?day=${day + 1}">${T.day} ${day + 1} →</a>` : `<a class="lv-btn" href="calendar.html">${T.finish} →</a>`}
          </div>
        </div>
        <div>
          <div class="sp"><div class="sp-lbl">${T.reflection}</div>${qs}<div class="sp-note">${T.notesNote}</div></div>
          <div class="sp">
            <div class="sp-lbl">${T.mood}</div>
            <div class="moods" id="moods">${MOODS.map((x, i) => `<button data-v="${i + 1}" class="${moodToday === i + 1 ? 'on' : ''}" aria-label="${x[1]}">${x[0]}<small>${x[1]}</small></button>`).join('')}</div>
            <div class="sp-note">${T.moodNote}</div>
          </div>
          <div class="sp">
            <div class="sp-lbl">${T.helpful}</div>
            <div class="btn-row"><button class="g-btn" data-fb="1">${T.yes}</button><button class="g-btn" data-fb="0">${T.notToday}</button><span class="sp-note" id="fb-thanks" style="margin:0;align-self:center"></span></div>
            <div class="btn-row" style="margin-top:12px"><button class="g-btn" id="share">${T.share}</button><a class="g-btn" href="https://wa.me/?text=${encodeURIComponent(LD.shareText(m))}" target="_blank" rel="noopener">WhatsApp</a><button class="g-btn" id="copy">${T.copy}</button></div>
          </div>
          <div class="sp"><div class="sp-lbl">${T.sources}</div><ol class="src-list" id="srcs"><li>Loading…</li></ol></div>
          <div class="sp">
            <div class="sp-lbl">${T.deeper}</div>
            <a class="sp-link" href="learn.html?topic=${m.theme}">${T.sevenDays}</a>
            <a class="sp-link" href="topics.html">${T.journey}</a>
            <a class="sp-link" href="tools.html">${T.toolboxLink}</a>
            <a class="sp-link" href="about.html">${T.why}</a>
            <a class="sp-link" href="subscribe.html">${T.email}</a>
          </div>
        </div>
      </div>
    </div>`;
  LDshell.addCrisis();
  document.getElementById('done').addEventListener('change', e => { LD.markDone(day, e.target.checked); e.target.parentElement.classList.toggle('on', e.target.checked); });
  app.querySelectorAll('.sp-ta').forEach(t => t.addEventListener('input', () => LD.saveJournal(day, t.dataset.i, t.value)));
  app.querySelectorAll('#moods button').forEach(b => b.addEventListener('click', () => { LD.saveMood(parseInt(b.dataset.v)); app.querySelectorAll('#moods button').forEach(x => x.classList.toggle('on', x === b)); }));
  app.querySelectorAll('[data-fb]').forEach(b => b.addEventListener('click', () => { LD.sendFeedback(m.id, b.dataset.fb === '1'); document.getElementById('fb-thanks').textContent = T.thanks; app.querySelectorAll('[data-fb]').forEach(x => x.disabled = true); }));
  document.getElementById('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(LD.shareText(m)); LD.toast('Copied'); } catch (e) {} });
  document.getElementById('share').addEventListener('click', async () => { const data = { title: m.title, text: LD.shareText(m) }; if (navigator.share) { try { await navigator.share(data); } catch (e) {} } else { try { await navigator.clipboard.writeText(data.text); LD.toast('Copied'); } catch (e) {} } });
  try {
    const srcs = await LD.getSources(sourceIds);
    document.getElementById('srcs').innerHTML = srcs.map(x => `<li>${esc(x.citation || x.title)}${x.doi ? ` <a href="https://doi.org/${esc(x.doi)}" target="_blank" rel="noopener">doi</a>` : ''}</li>`).join('') || '<li>See the evidence library.</li>';
  } catch (e) {}
  document.title = `${T.day} ${day}: ${m.title} — Light for Every Day`;
}
init().catch(err => { console.error(err); document.getElementById('loading').innerHTML = '<span class="load-t">Rest for a moment, then try again</span>'; });
</script>
</body>
</html>
